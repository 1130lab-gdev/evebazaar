# Postgres + ESI schema -- its own stack, separate from the sync tool
# (database/) and the read-only APIs (catalog-api/, map-api/), all of which
# reach it as `evebazaar-database` on the shared evebazaar-network bridge.
#
# Explicit project name: without it Compose derives "database" from this
# folder, which collides with other "database" projects on the same host.
name: eve-db

services:
  db:
    image: postgres:16-alpine
    container_name: evebazaar-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve}
      POSTGRES_DB: ${POSTGRES_DB:-eve}
    ports:
      - "127.0.0.1:5532:5432"
    volumes:
      - eve-db-data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - evebazaar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eve-db-data:
    name: ${DB_DATA_VOLUME:-database_eve-db-data}

networks:
  evebazaar-network:
    name: evebazaar-network
    external: true
