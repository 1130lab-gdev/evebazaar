# catalog-api -- read-only market/taxonomy API.
#
# Runs the same on a dev box and on the VPS. The VPS never has the source
# tree, so `build:` is only used locally; there it builds `catalog-api:latest`
# and (via create-containers.sh / `docker compose push`) that image is
# shipped to the box, which just pulls/loads and runs it.
#
#   local:  docker compose up -d --build
#   VPS:    docker compose pull && docker compose up -d      (REGISTRY set in .env)
#           -- or `docker load` a tar from create-containers.sh, then `up -d`
#
# All services share the external `evebazaar-network` bridge and reach
# Postgres as `evebazaar-database` (its container name) on it. Create the network
# once: `docker network create evebazaar-network`. start.sh does this
# automatically for local dev.
name: catalog-api

networks:
  evebazaar-network:
    external: true

services:
  catalog-api:
    container_name: catalog-api
    # REGISTRY (set in .env for the VPS, unset locally) prefixes the image,
    # e.g. registry.example.com/catalog-api:latest. Unset -> plain
    # `catalog-api:latest`, which is what `build:` and create-containers.sh
    # produce.
    image: ${REGISTRY:+${REGISTRY}/}catalog-api:${TAG:-latest}
    build:
      context: .
    networks: [evebazaar-network]
    ports:
      - "127.0.0.1:8091:8091"
    # Connection string is assembled from POSTGRES_USER / POSTGRES_PASSWORD /
    # POSTGRES_DB in catalog-api/.env (compose auto-loads it). USER and
    # PASSWORD are required -- compose refuses to start without them, so the
    # old eve/eve/eve dev defaults can't reach production by accident.
    # POSTGRES_HOST / POSTGRES_PORT default to the evebazaar-database container on
    # evebazaar-network (5432 is the in-container port). Set DATABASE_URL
    # directly to override the whole string (managed Postgres, sslmode).
    # Keep the credentials in sync with database/database/.env.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:?set POSTGRES_USER in catalog-api/.env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in catalog-api/.env}@${POSTGRES_HOST:-evebazaar-database}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-eve}}
      # Path prefix this service serves under, e.g. /api/catalog when a
      # shared-domain proxy forwards /api/catalog/* here without stripping.
      # Empty = serve at root (local dev).
      API_BASE_PATH: ${API_BASE_PATH:-}
    restart: unless-stopped
